<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <meta name="description" content="Notenlernen, eine lokale App für Noten- und Intervalltraining.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Notenlernen</title>
  </head>
  <body>
    <a class="skip" href="#inhalt">Zum Inhalt</a>
    <header class="shell">
      <p class="brand">Notenlernen</p>
      <nav aria-label="Bereiche">
        <a href="#notennamen">Notennamen</a>
        <a href="#visuelle-intervalle">Visuelle Intervalle</a>
        <a href="#gehoerintervalle">Gehörintervalle</a>
        <a href="#statistik">Statistik</a>
      </nav>
    </header>
    <main id="inhalt" class="shell" tabindex="-1">
      <div class="offline">
        <p id="offline-status" role="status"></p>
        <button id="check-update" type="button" hidden>Nach Updates suchen</button>
        <button id="apply-update" type="button" hidden>Update anwenden</button>
      </div>
      <section aria-labelledby="bereich">
        <h1 id="bereich" tabindex="-1">Notennamen</h1>
        <p id="beschreibung">Lies die Note und wähle ihren Namen.</p>
        <div id="training-round">
          <form id="round-setup">
            <label for="clefs">Notenschlüssel</label>
            <select id="clefs">
              <option value="treble">Violinschlüssel</option>
              <option value="bass">Bassschlüssel</option>
              <option value="mixed">Violin- und Bassschlüssel</option>
            </select>
            <div id="interval-settings" class="round-settings" hidden>
              <div>
                <label for="interval-mode">Gefragte Eigenschaft</label>
                <select id="interval-mode">
                  <option value="number">Intervallzahl</option>
                  <option value="quality">Intervallzahl und Qualität</option>
                </select>
              </div>
              <div>
                <label for="interval-direction">Richtung</label>
                <select id="interval-direction">
                  <option value="mixed">Gemischt</option>
                  <option value="up">Aufwärts</option>
                  <option value="down">Abwärts</option>
                </select>
              </div>
            </div>
            <fieldset>
              <legend>Tonarten</legend>
              <div class="quick-keys">
                <button type="button" data-keys="major">Alle Dur</button>
                <button type="button" data-keys="minor">Alle Moll</button>
                <button type="button" data-keys="simple">Bis zwei Vorzeichen</button>
                <button type="button" data-keys="all">Alle Tonarten</button>
              </div>
              <div class="key-groups" id="key-groups"></div>
            </fieldset>
            <div class="round-settings">
              <div>
                <label for="question-count">Aufgaben</label>
                <select id="question-count"></select>
                <label id="custom-count-label" hidden>Eigene Aufgabenanzahl
                  <input type="number" id="custom-count" min="1" max="1000" step="1" value="5" disabled required>
                </label>
              </div>
              <div>
                <label for="time-limit">Zeitlimit pro Aufgabe</label>
                <select id="time-limit"></select>
                <label id="custom-limit-label" hidden>Eigene Sekunden pro Aufgabe
                  <input type="number" id="custom-limit" min="1" max="3600" step="1" value="10" disabled required>
                </label>
              </div>
            </div>
            <button type="submit" id="start-round">Runde starten</button>
          </form>
          <div id="round-play" hidden>
            <h2 id="question-heading" tabindex="-1"></h2>
            <p id="countdown" role="timer" hidden></p>
            <div id="notation"></div>
            <div id="answers" class="answers" aria-label="Antwortoptionen"></div>
            <p id="feedback" role="status"></p>
            <button type="button" id="cancel-round">Runde abbrechen</button>
          </div>
          <div id="round-result" hidden>
            <h2 id="result-heading" tabindex="-1">Rundenauswertung</h2>
            <dl id="result-values"></dl>
            <button type="button" id="new-round">Neue Runde einrichten</button>
          </div>
          <p id="round-status" role="status"></p>
        </div>
      </section>
      <div class="settings">
        <label for="theme">Darstellung</label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Hell</option>
          <option value="dark">Dunkel</option>
        </select>
        <p id="storage-status" role="status"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
